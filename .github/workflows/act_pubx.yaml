# ⚠️ **参考样例，非池交付物**（init 归平台/使用方维护，不进池的部署范畴）——
#   在目标 repo 里落地成 `.github/workflows/act_pubx.yaml`。
#
# 它做什么：收到池/CLI 派发的 `payload`（base64 信封）→ 用 repo Secret 里的私钥解开 → 跑脚本 →
# 打印收工标记 `会话已结束 (rc=N)`（池侧就靠这行取**真实 rc**，取不到才按 conclusion 映射）。
#
# 协议（单一来源：`contracts/action.json` 的 `dispatch` 节）：
#   dispatch inputs：payload / os / timeout / job_timeout / cache
#   信封两种：解码后首字符 `{` → hybrid（{v,k,n,c}）；否则 → openssl smime（DER）
#   私钥：repo Secret `ACT_PUBX_KEY`（PEM；smime 与 hybrid 共用同一对密钥）
#
# 诚实说明：**这份模板没有在真机 GitHub 上端到端验过**（本沙箱出网受限、也没有可用的真 repo）。
# 第一次用请盯一次 run 的日志：能看到 `会话已结束 (rc=N)` 就成了。

name: act_pubx

on:
  workflow_dispatch:
    inputs:
      payload:
        description: base64(信封)
        required: true
      os:
        description: runner 标签
        required: false
        default: ubuntu-latest
      timeout:
        description: 有效工作时长（分钟）
        required: false
        default: "10"
      job_timeout:
        description: job 硬上限（分钟）
        required: false
        default: "30"
      cache:
        description: 保留位（池侧是一次性执行，恒为 0）
        required: false
        default: "0"

# 只读：这条 workflow 不需要写权限
permissions:
  contents: read

jobs:
  run:
    runs-on: ${{ inputs.os }}
    timeout-minutes: ${{ fromJSON(inputs.job_timeout) }}
    steps:
      - uses: actions/checkout@v4

      - name: 解封信封
        env:
          PAYLOAD: ${{ inputs.payload }}
          ACT_KEY: ${{ secrets.ACT_PUBX_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${ACT_KEY:-}" ]; then
            echo "::error::缺 Secret ACT_PUBX_KEY（PEM 私钥）—— 见 tools/onboard/gen-pubx-key.sh"
            exit 1
          fi
          umask 077
          printf '%s' "$ACT_KEY" > "$RUNNER_TEMP/act.key"
          printf '%s' "$PAYLOAD" | base64 -d > "$RUNNER_TEMP/env.bin"

          if [ "$(head -c 1 "$RUNNER_TEMP/env.bin")" = "{" ]; then
            # ---- hybrid：{v,k,n,c}（k=RSA-OAEP-SHA256(hex(cek))、c=AES-256-CBC、n=hex(iv)）----
            python3 - "$RUNNER_TEMP" <<'PY'
          import base64, json, os, subprocess, sys
          d = sys.argv[1]
          env = json.load(open(os.path.join(d, "env.bin"), "rb"))
          k = base64.b64decode(env["k"])
          c = base64.b64decode(env["c"])
          iv = bytes.fromhex(env["n"])
          cek_hex = subprocess.run(
              ["openssl", "pkeyutl", "-decrypt", "-inkey", os.path.join(d, "act.key"),
               "-pkeyopt", "rsa_padding_mode:oaep", "-pkeyopt", "rsa_oaep_md:sha256"],
              input=k, capture_output=True, check=True).stdout.decode().strip()
          open(os.path.join(d, "c.bin"), "wb").write(c)
          open(os.path.join(d, "iv.hex"), "w").write(iv.hex())
          open(os.path.join(d, "cek.hex"), "w").write(cek_hex)
          PY
            openssl enc -d -aes-256-cbc \
              -K "$(cat "$RUNNER_TEMP/cek.hex")" -iv "$(cat "$RUNNER_TEMP/iv.hex")" \
              -in "$RUNNER_TEMP/c.bin" -out "$RUNNER_TEMP/p.sh"
          else
            # ---- smime：DER 信封 ----
            openssl smime -decrypt -binary -inform DER \
              -inkey "$RUNNER_TEMP/act.key" -in "$RUNNER_TEMP/env.bin" -out "$RUNNER_TEMP/p.sh"
          fi
          chmod +x "$RUNNER_TEMP/p.sh"

      - name: 执行
        run: |
          set +e
          bash "$RUNNER_TEMP/p.sh"
          rc=$?
          # 收工标记：池侧取的是**这行**里的真实 rc（公开仓也拿得到，rc 不泄漏脚本内容）
          echo "会话已结束 (rc=$rc)"
          # 刻意 exit 0：脚本非零不算 workflow 失败 —— 真实 rc 已经由上面那行带回；
          # 这样 job 保持绿，日志/结论都干净（池侧优先读标记，读不到才按 conclusion 映射）
          exit 0
        shell: bash
        timeout-minutes: ${{ fromJSON(inputs.timeout) }}
